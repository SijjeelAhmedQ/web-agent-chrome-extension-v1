<!doctype html><html><head><meta charset="utf-8"><title>Consult Detail</title>
<style>
  body { font: 13px Arial, sans-serif; margin: 12px; }
  .modal { position: fixed; background: #fff; border: 1px solid #999; padding: 14px; box-shadow: 0 8px 30px #0004; }
  .close { float: right; border: 0; background: none; font-size: 18px; cursor: pointer; }
</style></head>
<body>
<h2>Consult — Arya STARK</h2>
<p id="result">Not saved</p>
<!-- Like Indici: the reason pop-up first, the patient's alerts a moment later, in front of it. -->
<div class="modal in" role="dialog" id="reason" style="top:60px;left:40px;width:520px;height:220px;z-index:10;display:none">
  <b>Add reason to view patient file</b><br><input id="r" title="Add reason to view patient file">
  <div style="position:absolute;bottom:12px;right:12px"><input type="button" value="Save" onclick="document.getElementById('result').textContent='Saved: '+document.getElementById('r').value;hide('reason')"></div>
</div>
<div class="modal in" role="dialog" id="alerts" style="top:70px;left:60px;width:460px;z-index:20;display:none">
  <button type="button" class="close" onclick="hide('alerts')">×</button>
  <h4 class="modal-title">Patient Alerts</h4><p>**ALLERGY ALERT**</p>
</div>
<script>
  function hide(id) { document.getElementById(id).style.display = 'none'; }
  setTimeout(() => (document.getElementById('reason').style.display = 'block'), 300);
  setTimeout(() => (document.getElementById('alerts').style.display = 'block'), 1500);
</script></body></html>
