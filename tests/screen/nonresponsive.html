<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- On purpose: no viewport meta, a fixed 1400px layout — a page made for one big screen only. -->
<title>Legacy Portal (test page — not responsive)</title>
<style>
  body { margin: 0; font: 14px Arial, sans-serif; width: 1400px; background: #f4f4f4; color: #222; }
  header { height: 56px; background: #234; color: #fff; position: relative; }
  header .brand { position: absolute; left: 16px; top: 16px; font-weight: bold; }
  header nav { position: absolute; left: 1050px; top: 18px; }
  header nav a { color: #fff; margin-right: 18px; text-decoration: none; }
  .more { position: absolute; left: 1310px; top: 10px; }
  .more > span { display: inline-block; padding: 8px; background: #456; color: #fff; cursor: pointer; }
  .more ul { display: none; position: absolute; right: 0; top: 34px; background: #fff; list-style: none; margin: 0; padding: 4px 0; width: 140px; box-shadow: 0 2px 8px #0004; }
  .more:hover ul { display: block; }
  .more li a { display: block; padding: 6px 12px; color: #222; text-decoration: none; }
  main { position: relative; height: 1500px; }
  .reports { position: absolute; left: 20px; top: 80px; width: 500px; display: none; background: #fff; padding: 12px; }
  .form { position: absolute; left: 900px; top: 80px; width: 460px; background: #fff; padding: 16px; }
  .form label { display: block; margin-top: 8px; }
  .form input, .form select { width: 300px; padding: 6px; }
  #preview { position: absolute; left: 1290px; top: 300px; }
  .orders { position: absolute; left: 20px; top: 420px; width: 600px; overflow-x: auto; background: #fff; }
  .orders table { width: 1100px; border-collapse: collapse; }
  .orders td, .orders th { border: 1px solid #ccc; padding: 6px; white-space: nowrap; }
  #help { position: absolute; left: 640px; top: 98px; width: 120px; height: 60px; background: #ffe08a; padding: 6px; }
  #delete-btn { position: absolute; left: 620px; top: 110px; }
  #continue { position: absolute; left: 600px; top: 1380px; }
  .cookies { position: fixed; left: 0; bottom: 0; width: 1400px; height: 140px; background: #222d; color: #fff; padding: 16px; box-sizing: border-box; }
  #invoice { position: absolute; left: 1290px; top: 360px; }
  #search { position: absolute; left: 860px; top: 14px; width: 160px; padding: 4px; }
  #status { position: absolute; left: 20px; top: 60px; font-weight: bold; }
</style>
</head>
<body>
<header>
  <span class="brand">Legacy Portal</span>
  <nav><a href="#" id="nav-home">Home</a><a href="#" id="nav-reports">Reports</a><a href="#" id="nav-help">Help</a></nav>
  <input id="search" placeholder="Search orders" aria-label="Search orders">
  <div class="more"><span>More ▾</span><ul><li><a href="#" id="m-export">Export</a></li><li><a href="#" id="m-print">Print</a></li></ul></div>
</header>
<main>
  <div id="status">Ready</div>
  <section class="reports" id="reports"><h3>Reports</h3><p>Total orders this month: <b>42</b></p></section>
  <section class="form"><h3>Sign-up</h3>
    <label>Full name <input id="name" name="name"></label>
    <label>Email <input id="email" name="email" type="email"></label>
    <label>Plan <select id="plan"><option value="">— choose —</option><option>Basic</option><option>Pro</option><option>Team</option></select></label>
  </section>
  <button id="preview">Preview</button>
  <a href="#" id="invoice">Download invoice</a>
  <button id="delete-btn">Archive draft</button>
  <div id="help">Need help? Call us.</div>
  <div class="orders"><table><thead><tr><th>Order</th><th>Customer</th><th>City</th><th>Items</th><th>Total</th><th>Placed</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
  <button id="continue">Continue</button>
</main>
<div class="cookies" id="cookies">We use cookies to run this site. <button id="accept">Accept</button></div>
<script>
  const status = (t) => (document.getElementById('status').textContent = t);
  const rows = document.getElementById('rows');
  for (let i = 0; i < 12; i++) {
    const n = 1020 + i;
    rows.insertAdjacentHTML('beforeend', `<tr><td>${n}</td><td>Customer ${i + 1}</td><td>Auckland</td><td>${i + 2}</td><td>$${(i + 3) * 10}.00</td><td>2026-11-${10 + i}</td><td>Open</td><td><button data-order="${n}">View</button></td></tr>`);
  }
  rows.addEventListener('click', (e) => e.target.dataset.order && status(`Viewing order ${e.target.dataset.order}`));
  document.getElementById('nav-reports').onclick = (e) => { e.preventDefault(); document.getElementById('reports').style.display = 'block'; status('Reports open'); };
  document.getElementById('m-export').onclick = (e) => { e.preventDefault(); status('Exported'); };
  document.getElementById('m-print').onclick = (e) => { e.preventDefault(); status('Print preview'); };
  document.getElementById('preview').onclick = () => status(`Preview: ${document.getElementById('name').value} / ${document.getElementById('email').value} / ${document.getElementById('plan').value}`);
  document.getElementById('delete-btn').onclick = () => status('Draft archived');
  document.getElementById('continue').onclick = () => status('Continued');
  // Only a real click counts here (some sites ignore a script's click): what a real mouse at the wrong place misses.
  document.getElementById('invoice').addEventListener('click', (e) => { e.preventDefault(); if (e.isTrusted) status('Invoice downloaded'); });
  document.getElementById('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') status('Searched: ' + e.target.value); });
  document.getElementById('accept').onclick = () => (document.getElementById('cookies').style.display = 'none');
</script>
</body>
</html>
